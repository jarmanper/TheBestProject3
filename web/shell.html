<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
:root { color-scheme: dark; }

html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	background-color: #171B1A;
	color: #D8D3A8;
	overflow: hidden;
	touch-action: none;
	font-family: 'Courier New', monospace;
}

#canvas {
	display: block;
	background-color: #171B1A;
}

#canvas:focus {
	outline: none;
}

#status, #start-overlay {
	position: absolute;
	inset: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 1rem;
	background-color: #171B1A;
}

#status {
	visibility: hidden;
}

#status-progress {
	width: 50%;
	max-width: 28rem;
}

#status-notice {
	background-color: #5b3943;
	border: 1px solid #9b3943;
	border-radius: 0.5rem;
	color: #e0e0e0;
	line-height: 1.3;
	margin: 0 2rem;
	padding: 1rem;
	text-align: center;
	display: none;
	z-index: 1;
}

#start-overlay {
	cursor: pointer;
	z-index: 2;
	user-select: none;
}

#start-overlay .title {
	font-size: 1.5rem;
	letter-spacing: 0.1rem;
	color: #E87932;
}

#start-overlay .hint {
	font-size: 1rem;
	color: #D8D3A8;
	border: 2px solid #626D58;
	padding: 0.75rem 1.5rem;
}

#start-overlay.hidden {
	display: none;
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<div id="start-overlay">
			<div class="title">$GODOT_PROJECT_NAME</div>
			<div class="hint">Click to start</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
// Custom HTML shell: dark page matching the game's palette, and a
// "click to start" gate so audio and pointer lock only ever begin inside a
// real user gesture (required by browsers, and GitHub Pages cannot send the
// COOP/COEP headers threads would need, so thread support stays off).
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const startOverlay = document.getElementById('start-overlay');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function startGame() {
		startOverlay.classList.add('hidden');
		setStatusMode('progress');
		engine.startGame({
			onProgress: function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		startOverlay.classList.add('hidden');
		const missingMsg = 'Error\nThe following features required to run this game are missing:\n';
		displayFailureNotice(missingMsg + missing.join('\n'));
	} else if (new URLSearchParams(window.location.search).get('autostart') === '1') {
		// Dev only (automated browser smoke tests): ?autostart=1 starts the engine without the
		// click gate. Audio stays locked until a real click; players never use this URL.
		startGame();
	} else {
		startOverlay.addEventListener('click', startGame, { once: true });
	}
}());
		</script>
	</body>
</html>
