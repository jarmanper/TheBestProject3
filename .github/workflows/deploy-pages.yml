name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; never cancel one that is already uploading.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Godot's release-asset URLs use the hyphenated form ("4.7.2-stable"), but the
  # editor looks for its export templates under a dot-separated directory name
  # ("4.7.2.stable") in ~/.local/share/godot/export_templates/ — keep both.
  GODOT_VERSION: "4.7.2-stable"
  GODOT_TEMPLATES_DIR_VERSION: "4.7.2.stable"

jobs:
  build:
    name: Export Web build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot/editor
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-v2

      - name: Download Godot editor
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot/editor
          curl -fL -o /tmp/godot-editor.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q /tmp/godot-editor.zip -d ~/godot/editor
          rm /tmp/godot-editor.zip

      - name: Download Godot export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          # ~1.3 GB; cached above so this only runs once per Godot version.
          mkdir -p ~/.local/share/godot/export_templates
          curl -fL -o /tmp/godot-templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_export_templates.tpz"
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          rm /tmp/godot-templates.tpz
          mv /tmp/godot-templates/templates "$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATES_DIR_VERSION}"
          rm -rf /tmp/godot-templates

      - name: Locate Godot editor binary
        run: |
          GODOT_BIN="$(find ~/godot/editor -maxdepth 1 -type f -name 'Godot_*' | head -n1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT=$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Import project
        run: '"$GODOT" --headless --path . --import'

      # The runner exits 1 when any test fails (or logs an engine error), which fails the job
      # before anything is exported or deployed.
      - name: Run tests
        timeout-minutes: 20
        run: '"$GODOT" --headless --path . -s res://tests/run_tests.gd'

      - name: Export Web build
        run: tools/build_web.sh

      - name: Add .nojekyll
        run: touch build/web/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
