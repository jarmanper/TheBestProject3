name: Deploy Web Build to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.7.2
    steps:
      - name: Check out project
        uses: actions/checkout@v6

      - name: Prepare Godot export templates
        shell: bash
        run: |
          template_version="4.7.2.stable"
          target="$HOME/.local/share/godot/export_templates/$template_version"
          source="/root/.local/share/godot/export_templates/$template_version"
          if [ ! -d "$target" ]; then
            mkdir -p "$(dirname "$target")"
            cp -a "$source" "$target"
          fi

      - name: Export Web build
        shell: bash
        run: |
          mkdir -p build/web
          godot --headless --verbose --export-release "Web" build/web/index.html
          touch build/web/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
